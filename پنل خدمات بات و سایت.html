<body>
    <div id="root"></div>

    <!-- Firebase Imports -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, updateDoc, doc, query, onSnapshot, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.firebaseModules = {
            initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged,
            getFirestore, collection, addDoc, getDocs, updateDoc, doc, query, onSnapshot, orderBy
        };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Utility to resize image before uploading to Firestore (to prevent 1MB limit issues)
        const resizeImage = (file) => {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800;
                        const scale = Math.min(MAX_WIDTH / img.width, 1);
                        canvas.width = img.width * scale;
                        canvas.height = img.height * scale;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.6));
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });
        };

        const App = () => {
            // Core States
            const [view, setView] = useState('home'); // home, userPanel, bot, site, checkout, admin, support, myOrders
            const [checkoutData, setCheckoutData] = useState(null); // Data pending payment
            const [toast, setToast] = useState(null);
            
            // Firebase States
            const [db, setDb] = useState(null);
            const [authData, setAuthData] = useState(null);
            const [appId, setAppId] = useState('default-app-id');
            const [userOrders, setUserOrders] = useState([]);
            const [allOrders, setAllOrders] = useState([]);
            
            // Admin Auth State
            const [isAdminAuth, setIsAdminAuth] = useState(false);

            const showToast = (msg, type = 'info') => {
                setToast({ msg, type });
                setTimeout(() => setToast(null), 4000);
            };

            useEffect(() => {
                const initFirebase = async () => {
                    if (!window.firebaseModules) {
                        setTimeout(initFirebase, 100);
                        return;
                    }
                    try {
                        const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, getFirestore } = window.firebaseModules;
                        
                        const currentAppId = typeof __app_id !== 'undefined' ? __app_id : 'tech-panel-app';
                        setAppId(currentAppId);
                        
                        let app, currentDb, currentAuth;
                        
                        if (typeof __firebase_config !== 'undefined') {
                            const firebaseConfig = JSON.parse(__firebase_config);
                            app = initializeApp(firebaseConfig);
                        } else {
                            // Fallback config if not in strict environment
                            app = initializeApp({ projectId: "demo-project" }); 
                        }
                        
                        currentDb = getFirestore(app);
                        currentAuth = getAuth(app);
                        setDb(currentDb);

                        if (typeof __initial_auth_token !== 'undefined') {
                            await signInWithCustomToken(currentAuth, __initial_auth_token);
                        } else {
                            await signInAnonymously(currentAuth);
                        }
                        
                        setAuthData(currentAuth.currentUser);
                    } catch (error) {
                        console.error("Firebase Init Error:", error);
                        showToast("خطا در ارتباط با سرور", "error");
                    }
                };
                initFirebase();
            }, []);

            useEffect(() => {
                if (!db || !authData) return;

                const { collection, onSnapshot, query } = window.firebaseModules;
                const ordersRef = collection(db, 'artifacts', appId, 'public', 'data', 'orders');
                
                const unsubscribe = onSnapshot(query(ordersRef), (snapshot) => {
                    const fetchedOrders = [];
                    snapshot.forEach((doc) => {
                        fetchedOrders.push({ id: doc.id, ...doc.data() });
                    });
                    
                    // Sort descending by timestamp locally (Rule: no complex firestore queries)
                    fetchedOrders.sort((a, b) => b.timestamp - a.timestamp);
                    
                    setAllOrders(fetchedOrders);
                    
                    // Filter user's specific orders
                    const myOrders = fetchedOrders.filter(o => o.userId === authData.uid);
                    setUserOrders(myOrders);
                }, (error) => {
                    console.error("Fetch orders error:", error);
                });

                return () => unsubscribe();
            }, [db, authData, appId]);

            const ToastComponent = () => {
                if (!toast) return null;
                const bgColors = {
                    success: 'bg-green-600',
                    error: 'bg-red-600',
                    info: 'bg-blue-600',
                    warning: 'bg-yellow-600'
                };
                return (
                    <div className={`fixed top-5 left-1/2 transform -translate-x-1/2 z-50 px-6 py-3 rounded-xl shadow-2xl text-white font-medium ${bgColors[toast.type] || 'bg-gray-800'} transition-all duration-300 animate-bounce`}>
                        {toast.msg}
                    </div>
                );
            };

            const SupportView = () => (
                <div className="flex flex-col items-center justify-center min-h-screen p-4">

                        <i className="ph ph-headset text-6xl text-brand-500"></i>
                        <h2 className="text-2xl font-bold">پشتیبانی</h2>
                        <p className="text-gray-300">برای هرگونه سوال یا مشکل با آیدی زیر در تلگرام ارتباط برقرار کنید.</p>
                        <div className="bg-slate-800 p-4 rounded-xl border border-slate-700">
                            <span className="block text-brand-400 font-bold text-xl mb-2" dir="ltr">@Mrbottelegram88</span>
                            <span className="text-sm text-gray-400">در تلگرام پیام دهید</span>
                        </div>
                        <button onClick={() => setView('home')} className="mt-4 bg-slate-700 hover:bg-slate-600 px-6 py-2 rounded-lg w-full transition">بازگشت</button>

            const BotFormView = () => {

                        showToast("لطفا تمام فیلدها را پر کنید", "warning");
                        return;
                    }
                    setCheckoutData({
                        type: 'bot',
                        title: 'ربات سفارشی',
                        price: 125000,
                        details: form
                    });
                    setView('checkout');
                };

                return (
                    <div className="min-h-screen p-4 flex flex-col items-center justify-center bot-background relative pt-20">
                        <button onClick={() => setView('userPanel')} className="absolute top-6 right-6 bg-slate-800/80 p-3 rounded-full hover:bg-slate-700 transition">

                        <div className="glass-panel p-8 rounded-3xl max-w-lg w-full shadow-2xl relative overflow-hidden">

                                <div className="mt-4 inline-block bg-blue-500/20 text-blue-300 px-4 py-2 rounded-full font-bold">

                                </div>
                            </div>

                            <div className="bg-red-500/10 border border-red-500/30 rounded-xl p-4 mb-6 text-sm text-red-200">
                                <strong className="text-red-400 block mb-1"><i className="ph ph-warning-circle inline align-middle mr-1"></i> نکته مهم:</strong>
                                برای ساختن بات هر چیزی که دوست داشتید میتوانید بگید ولی <b>بات های هکی هرگز!</b>
                            </div>

                            <form onSubmit={handleSubmit} className="space-y-4">

                                    <label className="block text-sm text-gray-400 mb-1">اسم و فامیل</label>
                                    <input type="text" className="w-full bg-slate-800/50 border border-slate-600 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500 transition" value={form.name} onChange={e => setForm({...form, name: e.target.value})} />
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-sm text-gray-400 mb-1">ایمیل</label>
                                        <input type="email" dir="ltr" className="w-full bg-slate-800/50 border border-slate-600 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500 transition" value={form.email} onChange={e => setForm({...form, email: e.target.value})} />
                                    </div>
                                    <div>
                                        <label className="block text-sm text-gray-400 mb-1">پسوورد</label>
                                        <input type="text" dir="ltr" className="w-full bg-slate-800/50 border border-slate-600 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500 transition" value={form.password} onChange={e => setForm({...form, password: e.target.value})} />
                                    </div>
                                </div>
                                
                                <div className="bg-yellow-500/10 border border-yellow-500/30 rounded-xl p-4 my-2 text-sm text-yellow-200">
                                    <strong className="text-yellow-400 block mb-1"><i className="ph ph-siren inline align-middle mr-1"></i> هشدار!</strong>
                                    توجه داشته باشید برای پر کردن بخش ایمیل و پسوورد باید یک ایمیلی باشد که هیچ چیزی بر روی آن سیو نشده باشد و جایی ذخیره یا داده نشده باشد. باتشکر!
                                </div>

                                <div>
                                    <label className="block text-sm text-gray-400 mb-1">ایده شما</label>
                                    <textarea rows="4" className="w-full bg-slate-800/50 border border-slate-600 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500 transition resize-none" placeholder="ایده خود را اینجا بنویسید..." value={form.idea} onChange={e => setForm({...form, idea: e.target.value})}></textarea>
                                </div>

                                <button type="submit" className="w-full bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white font-bold py-4 rounded-xl shadow-lg transform transition hover:scale-[1.02]">
                                    تایید و مرحله پرداخت
                                </button>
                            </form>
                        </div>
                    </div>
                );
            };

            const SiteFormView = () => {
                const [form, setForm] = useState({ 
                    name: '', email: '', password: '', 
                    serverType: 'اختصاصی', time: '1 ماه', 
                    siteName: '', storage: 10, ram: 2, cores: 1 
                });
                const [isCalculating, setIsCalculating] = useState(false);
                const [calculatedPrice, setCalculatedPrice] = useState(null);

                const handleCalculateAI = () => {
                    if(!form.name || !form.email || !form.password || !form.siteName) {
                        showToast("لطفا اطلاعات هویتی و نام سایت را پر کنید", "warning");
                        return;
                    }
                    setIsCalculating(true);
                    setCalculatedPrice(null);

                    // Simulate AI connecting to Datacenter
                    setTimeout(() => {
                        // Mock Calculation Logic
                        let base = form.serverType === 'اختصاصی' ? 200000 : 100000;
                        let timeMult = parseInt(form.time) || 1;
                        let total = (base + (form.ram * 45000) + (form.cores * 80000) + (form.storage * 5000)) * timeMult;
                        
                        // Add some randomness to make it look "AI" calculated live
                        total = total + (Math.floor(Math.random() * 5) * 1000); 

                        setCalculatedPrice(total);
                        setIsCalculating(false);
                        showToast("اطلاعات با موفقیت بررسی و تایید شد", "success");
                    }, 2000);
                };

                const handleProceedToPay = () => {
                    setCheckoutData({
                        type: 'site',
                        title: 'سرور و سایت',
                        price: calculatedPrice,
                        details: form
                    });
                    setView('checkout');
                };

                return (
                    <div className="min-h-screen p-4 flex flex-col items-center justify-center bg-slate-900 relative pt-20">
                        <button onClick={() => setView('userPanel')} className="absolute top-6 right-6 bg-slate-800 p-3 rounded-full hover:bg-slate-700 transition">
                            <i className="ph ph-arrow-right text-xl"></i>
                        </button>

                        <div className="glass-panel p-8 rounded-3xl max-w-2xl w-full shadow-2xl">
                            <div className="text-center mb-8">
                                <i className="ph ph-globe text-5xl text-emerald-400 mb-2"></i>
                                <h2 className="text-3xl font-bold mb-2">خرید سایت و سرور</h2>
                                <p className="text-gray-400 text-sm">ارتباط هوشمند با دیتاسنترها برای محاسبه آنی قیمت</p>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                                {/* User Info */}
                                <div className="space-y-4">
                                    <h3 className="text-lg font-semibold border-b border-slate-700 pb-2 text-brand-400">اطلاعات کاربری</h3>
                                    <div>
                                        <label className="block text-sm text-gray-400 mb-1">اسم و فامیل</label>
                                        <input type="text" className="w-full bg-slate-800 border border-slate-600 rounded-lg p-2 text-white" value={form.name} onChange={e => setForm({...form, name: e.target.value})} />
                                    </div>
                                    <div>
                                        <label className="block text-sm text-gray-400 mb-1">ایمیل</label>
                                        <input type="email" dir="ltr" className="w-full bg-slate-800 border border-slate-600 rounded-lg p-2 text-white" value={form.email} onChange={e => setForm({...form, email: e.target.value})} />
                                    </div>
                                    <div>
                                        <label className="block text-sm text-gray-400 mb-1">پسوورد</label>
                                        <input type="text" dir="ltr" className="w-full bg-slate-800 border border-slate-600 rounded-lg p-2 text-white" value={form.password} onChange={e => setForm({...form, password: e.target.value})} />
                                    </div>
                                    <div className="bg-yellow-500/10 border border-yellow-500/30 rounded-lg p-2 mt-2 text-xs text-yellow-200">
                                        توجه: ایمیل نباید قبلا استفاده شده باشد.
                                    </div>
                                </div>

                                {/* Server Specs */}
                                <div className="space-y-4">
                                    <h3 className="text-lg font-semibold border-b border-slate-700 pb-2 text-brand-400">مشخصات سرور</h3>
                                    
                                    <div>
                                        <label className="block text-sm text-gray-400 mb-1">نوع سرور</label>
                                        <select className="w-full bg-slate-800 border border-slate-600 rounded-lg p-2 text-white" value={form.serverType} onChange={e => setForm({...form, serverType: e.target.value})}>
                                            <option value="ابری">سرور ابری</option>
                                            <option value="اختصاصی">سرور اختصاصی</option>
                                        </select>
                                    </div>
                                    
                                    <div>
                                        <label className="block text-sm text-gray-400 mb-1">زمان سایت</label>
                                        <select className="w-full bg-slate-800 border border-slate-600 rounded-lg p-2 text-white" value={form.time} onChange={e => setForm({...form, time: e.target.value})}>
                                            <option value="1">1 ماهه</option>
                                            <option value="3">3 ماهه</option>
                                            <option value="6">6 ماهه</option>
                                            <option value="12">1 ساله</option>
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-sm text-gray-400 mb-1">اسم سایت (دامین)</label>
                                        <input type="text" dir="ltr" placeholder="example.com" className="w-full bg-slate-800 border border-slate-600 rounded-lg p-2 text-white" value={form.siteName} onChange={e => setForm({...form, siteName: e.target.value})} />
                                    </div>

                                    <div className="grid grid-cols-3 gap-2">
                                        <div>
                                            <label className="block text-xs text-gray-400 mb-1">حافظه (GB)</label>
                                            <input type="number" min="10" className="w-full bg-slate-800 border border-slate-600 rounded-lg p-2 text-white" value={form.storage} onChange={e => setForm({...form, storage: e.target.value})} />
                                        </div>
                                        <div>
                                            <label className="block text-xs text-gray-400 mb-1">رم (GB)</label>
                                            <input type="number" min="1" className="w-full bg-slate-800 border border-slate-600 rounded-lg p-2 text-white" value={form.ram} onChange={e => setForm({...form, ram: e.target.value})} />
                                        </div>
                                        <div>
                                            <label className="block text-xs text-gray-400 mb-1">هسته</label>
                                            <input type="number" min="1" className="w-full bg-slate-800 border border-slate-600 rounded-lg p-2 text-white" value={form.cores} onChange={e => setForm({...form, cores: e.target.value})} />
                                        </div>
                                    </div>
                                </div>
                            </div>

                            {/* AI Calculation Area */}
                            <div className="mt-8 border-t border-slate-700 pt-6 flex flex-col items-center">
                                {!calculatedPrice && !isCalculating && (
                                    <button onClick={handleCalculateAI} className="w-full md:w-auto bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-500 hover:to-teal-400 text-white font-bold py-3 px-8 rounded-xl shadow-lg flex items-center justify-center gap-2">
                                        <i className="ph ph-cpu text-xl"></i>
                                        محاسبه قیمت توسط هوش مصنوعی
                                    </button>
                                )}

                                {isCalculating && (
                                    <div className="flex flex-col items-center text-emerald-400">

                                        <p className="animate-pulse">در حال ارتباط با هوش مصنوعی و بررسی منابع...</p>

                                            <p className="text-4xl font-bold text-white">{calculatedPrice.toLocaleString('fa-IR')} <span className="text-lg text-emerald-400">تومان</span></p>
                                        </div>
                                        <button onClick={handleProceedToPay} className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl shadow-lg text-lg">

                                    </div>
                                )}
                            </div>

            };

            const CheckoutView = () => {
                const [receiptBase64, setReceiptBase64] = useState(null);
                const [isSubmitting, setIsSubmitting] = useState(false);
                const fileInputRef = useRef(null);

                const handleImageUpload = async (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        if (file.size > 2 * 1024 * 1024) {
                            showToast("حجم عکس نباید بیشتر از 2 مگابایت باشد.", "error");
                            return;
                        }
                        try {
                            const resized = await resizeImage(file);
                            setReceiptBase64(resized);
                        } catch (err) {
                            showToast("خطا در پردازش تصویر", "error");
                        }
                    }
                };

                const handleSubmitOrder = async () => {
                    if (!receiptBase64) {
                        showToast("لطفا عکس رسید پرداخت را آپلود کنید", "warning");
                        return;
                    }
                    if (!authData || !db) {
                        showToast("خطای دسترسی به دیتابیس", "error");
                        return;
                    }

                    setIsSubmitting(true);
                    try {
                        const { collection, addDoc } = window.firebaseModules;
                        const ordersRef = collection(db, 'artifacts', appId, 'public', 'data', 'orders');
                        
                        await addDoc(ordersRef, {
                            userId: authData.uid,
                            type: checkoutData.type,
                            title: checkoutData.title,
                            price: checkoutData.price,
                            details: checkoutData.details,
                            receiptImage: receiptBase64,
                            status: 'pending', // pending, accepted, rejected
                            timestamp: Date.now()
                        });

                        showToast("سفارش شما با موفقیت ثبت شد و در انتظار تایید مدیریت است.", "success");
                        setCheckoutData(null);
                        setView('myOrders');
                    } catch (error) {
                        console.error("Order submission error:", error);
                        showToast("خطا در ثبت سفارش", "error");
                    }
                    setIsSubmitting(false);
                };

                if (!checkoutData) return null;

                return (
                    <div className="min-h-screen p-4 flex flex-col items-center justify-center bg-slate-900 relative">
                        <button onClick={() => setView(checkoutData.type === 'bot' ? 'bot' : 'site')} className="absolute top-6 right-6 bg-slate-800 p-3 rounded-full hover:bg-slate-700 transition">
                            <i className="ph ph-arrow-right text-xl"></i>
                        </button>

                        <div className="bg-slate-800 p-8 rounded-3xl max-w-md w-full shadow-2xl">
                            <h2 className="text-2xl font-bold mb-6 text-center border-b border-slate-700 pb-4">تکمیل خرید</h2>
                            
                            <div className="bg-slate-700/50 rounded-xl p-4 mb-6 text-center">
                                <p className="text-gray-400 mb-1">مبلغ قابل پرداخت</p>
                                <p className="text-3xl font-bold text-white mb-2">{checkoutData.price.toLocaleString('fa-IR')} <span className="text-sm font-normal text-gray-400">تومان</span></p>
                                <div className="text-xs text-brand-400 bg-brand-900/30 py-1 px-3 rounded-full inline-block">بابت: {checkoutData.title}</div>
                            </div>

                            <div className="bg-gradient-to-r from-blue-900 to-indigo-900 rounded-xl p-6 mb-6 shadow-inner relative overflow-hidden">
                                <div className="absolute top-0 right-0 p-3 opacity-20"><i className="ph ph-credit-card text-6xl"></i></div>
                                <p className="text-gray-300 text-sm mb-2 relative z-10">شماره کارت جهت واریز:</p>
                                <p className="text-2xl font-mono tracking-widest text-white mb-4 relative z-10" dir="ltr">6219 8618 5815 8784</p>
                                <p className="text-gray-300 relative z-10"><i className="ph ph-user inline mr-1"></i> علیرضا نوروزی گوگه</p>
                            </div>

                            <div className="mb-8">
                                <label className="block text-sm text-gray-400 mb-3 text-center">لطفا پس از واریز، عکس رسید خود را آپلود کنید</label>
                                <div 
                                    className={`border-2 border-dashed ${receiptBase64 ? 'border-brand-500 bg-brand-900/20' : 'border-slate-600 bg-slate-800'} rounded-xl p-6 text-center cursor-pointer transition hover:border-brand-400`}
                                    onClick={() => fileInputRef.current.click()}
                                >
                                    {receiptBase64 ? (
                                        <div className="flex flex-col items-center">
                                            <i className="ph ph-check-circle text-4xl text-green-500 mb-2"></i>
                                            <span className="text-sm text-green-400">رسید با موفقیت انتخاب شد</span>
                                            <span className="text-xs text-gray-500 mt-2 block">(برای تغییر کلیک کنید)</span>
                                        </div>
                                    ) : (
                                        <div className="flex flex-col items-center">
                                            <i className="ph ph-upload-simple text-4xl text-gray-500 mb-2"></i>
                                            <span className="text-sm text-gray-400">انتخاب عکس رسید</span>
                                        </div>
                                    )}
                                </div>
                                <input type="file" accept="image/*" className="hidden" ref={fileInputRef} onChange={handleImageUpload} />
                            </div>

                            <button 
                                onClick={handleSubmitOrder}
                                disabled={isSubmitting}
                                className={`w-full ${isSubmitting ? 'bg-slate-600' : 'bg-green-600 hover:bg-green-500'} text-white font-bold py-4 rounded-xl shadow-lg flex justify-center items-center gap-2`}
                            >
                                {isSubmitting ? <div className="loader border-t-white w-6 h-6 border-2"></div> : 'تایید نهایی و ارسال سفارش'}
                            </button>
                        </div>
                    </div>
                );
            };

            const MyOrdersView = () => (
                <div className="min-h-screen p-4 md:p-8 bg-slate-900 pt-20">
                    <button onClick={() => setView('userPanel')} className="absolute top-6 right-6 bg-slate-800 p-3 rounded-full hover:bg-slate-700 transition">
                        <i className="ph ph-arrow-right text-xl"></i>
                    </button>
                    <h2 className="text-2xl font-bold mb-6 text-center">سفارشات من</h2>
                    
                    <div className="max-w-4xl mx-auto space-y-4">
                        {userOrders.length === 0 ? (
                            <div className="text-center text-gray-500 py-10 bg-slate-800 rounded-xl">
                                هیچ سفارشی یافت نشد
                            </div>
                        ) : (
                            userOrders.map(order => (
                                <div key={order.id} className="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-col md:flex-row items-center justify-between gap-4">
                                    <div className="flex items-center gap-4 w-full md:w-auto">
                                        <div className={`p-3 rounded-full ${order.type === 'bot' ? 'bg-blue-500/20 text-blue-400' : 'bg-emerald-500/20 text-emerald-400'}`}>
                                            <i className={`ph text-2xl ${order.type === 'bot' ? 'ph-robot' : 'ph-globe'}`}></i>
                                        </div>
                                        <div>
                                            <h4 className="font-bold">{order.title}</h4>
                                            <p className="text-xs text-gray-400">{new Date(order.timestamp).toLocaleString('fa-IR')}</p>
                                        </div>
                                    </div>
                                    
                                    <div className="flex items-center justify-between w-full md:w-auto gap-6">
                                        <div className="text-left md:text-right">
                                            <span className="block text-sm text-gray-400">وضعیت سفارش:</span>
                                            {order.status === 'pending' && <span className="text-yellow-400 font-bold bg-yellow-400/10 px-3 py-1 rounded-full text-sm">در حال بررسی</span>}
                                            {order.status === 'accepted' && <span className="text-green-400 font-bold bg-green-400/10 px-3 py-1 rounded-full text-sm">سفارش شما ثبت شد</span>}
                                            {order.status === 'rejected' && <span className="text-red-400 font-bold bg-red-400/10 px-3 py-1 rounded-full text-sm">سفارش رد شد</span>}
                                        </div>
                                        <div className="font-bold text-lg">{order.price.toLocaleString('fa-IR')} <span className="text-xs font-normal">تومان</span></div>
                                    </div>
                                </div>
                            ))
                        )}
                    </div>
                </div>
            );

            const AdminPanelView = () => {
                const [adminPass, setAdminPass] = useState('');
                const [selectedOrderReceipt, setSelectedOrderReceipt] = useState(null);

                const handleLogin = (e) => {
                    e.preventDefault();
                    if (adminPass === 'alireza') { // Hardcoded pin as requested logic simulation
                        setIsAdminAuth(true);
                        showToast("ورود موفق", "success");
                    } else {
                        showToast("رمز عبور اشتباه است", "error");
                    }
                };

                const updateOrderStatus = async (orderId, newStatus) => {
                    try {
                        const { doc, updateDoc } = window.firebaseModules;
                        const orderRef = doc(db, 'artifacts', appId, 'public', 'data', 'orders', orderId);
                        await updateDoc(orderRef, { status: newStatus });
                        showToast(`وضعیت سفارش به ${newStatus === 'accepted' ? 'ثبت شده' : 'رد شده'} تغییر یافت.`, "success");
                        setSelectedOrderReceipt(null);
                    } catch (error) {
                        console.error("Update error:", error);
                        showToast("خطا در بروزرسانی", "error");
                    }
                };

                if (!isAdminAuth) {
                    return (
                        <div className="flex flex-col items-center justify-center min-h-screen p-4">
                             <button onClick={() => setView('home')} className="absolute top-6 right-6 bg-slate-800 p-3 rounded-full hover:bg-slate-700 transition">
                                <i className="ph ph-arrow-right text-xl"></i>
                            </button>
                            <div className="glass-panel p-8 rounded-2xl max-w-sm w-full text-center">
                                <i className="ph ph-shield-check text-5xl text-brand-500 mb-4"></i>
                                <h2 className="text-xl font-bold mb-6">ورود به پنل مدیریت</h2>
                                <form onSubmit={handleLogin}>
                                    <input type="password" placeholder="رمز عبور" className="w-full bg-slate-800 border border-slate-600 rounded-lg p-3 text-center mb-4 text-white" value={adminPass} onChange={e => setAdminPass(e.target.value)} />
                                    <button type="submit" className="w-full bg-brand-600 hover:bg-brand-500 py-3 rounded-lg font-bold transition">ورود</button>
                                </form>
                                <p className="text-xs text-gray-500 mt-4">رمز عبور: alireza</p>
                            </div>
                        </div>
                    );
                }

                return (
                    <div className="min-h-screen p-4 md:p-8 bg-slate-900 pt-20">
                        <div className="flex justify-between items-center mb-8 bg-slate-800 p-4 rounded-xl">
                            <h2 className="text-2xl font-bold text-brand-400">پنل مدیریت سفارشات</h2>
                            <button onClick={() => setView('home')} className="bg-slate-700 px-4 py-2 rounded hover:bg-slate-600 transition flex items-center gap-2">
                                خروج از مدیریت <i className="ph ph-sign-out"></i>
                            </button>
                        </div>

                        <div className="overflow-x-auto">
                            <table className="w-full text-right border-collapse">
                                <thead>
                                    <tr className="bg-slate-800 text-gray-300">
                                        <th className="p-3 rounded-tr-lg">مشتری</th>
                                        <th className="p-3">نوع/مبلغ</th>
                                        <th className="p-3">جزئیات</th>
                                        <th className="p-3">وضعیت</th>
                                        <th className="p-3 rounded-tl-lg">عملیات</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {allOrders.map(order => (
                                        <tr key={order.id} className="border-b border-slate-700/50 hover:bg-slate-800/50 transition">
                                            <td className="p-3">
                                                <div className="font-bold">{order.details.name}</div>
                                                <div className="text-xs text-gray-400 dir-ltr text-right">{order.details.email}</div>
                                            </td>
                                            <td className="p-3">
                                                <div className="text-brand-300">{order.title}</div>
                                                <div className="font-mono text-sm">{order.price.toLocaleString()} تومان</div>
                                            </td>
                                            <td className="p-3 text-xs text-gray-400 max-w-xs truncate">
                                                {order.type === 'bot' ? (
                                                    <span>ایده: {order.details.idea}</span>
                                                ) : (
                                                    <span>
                                                        دامنه: {order.details.siteName} | {order.details.serverType} | 
                                                        رم:{order.details.ram} هسته:{order.details.cores} هارد:{order.details.storage}
                                                    </span>
                                                )}
                                            </td>
                                            <td className="p-3">
                                                {order.status === 'pending' && <span className="text-yellow-400 bg-yellow-400/10 px-2 py-1 rounded text-xs">در انتظار</span>}
                                                {order.status === 'accepted' && <span className="text-green-400 bg-green-400/10 px-2 py-1 rounded text-xs">ثبت شد</span>}
                                                {order.status === 'rejected' && <span className="text-red-400 bg-red-400/10 px-2 py-1 rounded text-xs">رد شد</span>}
                                            </td>
                                            <td className="p-3">
                                                <button onClick={() => setSelectedOrderReceipt(order)} className="bg-blue-600 hover:bg-blue-500 text-xs px-3 py-2 rounded">
                                                    بررسی رسید
                                                </button>
                                            </td>
                                        </tr>
                                    ))}
                                    {allOrders.length === 0 && (
                                        <tr><td colSpan="5" className="text-center p-8 text-gray-500">سفارشی موجود نیست.</td></tr>
                                    )}
                                </tbody>
                            </table>
                        </div>

                        {/* Receipt Modal */}
                        {selectedOrderReceipt && (
                            <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
                                <div className="bg-slate-800 p-6 rounded-2xl max-w-lg w-full">
                                    <h3 className="text-xl font-bold mb-4">بررسی رسید پرداخت</h3>
                                    <div className="bg-slate-900 rounded-lg p-2 mb-4 h-64 flex items-center justify-center overflow-hidden">
                                        <img src={selectedOrderReceipt.receiptImage} alt="رسید" className="max-h-full max-w-full object-contain" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-4 mb-4 text-sm bg-slate-700/50 p-3 rounded-lg">
                                        <div>مبلغ: {selectedOrderReceipt.price.toLocaleString()} تومان</div>
                                        <div>مشتری: {selectedOrderReceipt.details.name}</div>
                                    </div>
                                    
                                    <div className="flex gap-4">
                                        <button onClick={() => updateOrderStatus(selectedOrderReceipt.id, 'accepted')} className="flex-1 bg-green-600 hover:bg-green-500 py-3 rounded-lg font-bold text-white transition flex justify-center items-center gap-2">
                                            <i className="ph ph-check-circle"></i> تایید و ثبت
                                        </button>
                                        <button onClick={() => updateOrderStatus(selectedOrderReceipt.id, 'rejected')} className="flex-1 bg-red-600 hover:bg-red-500 py-3 rounded-lg font-bold text-white transition flex justify-center items-center gap-2">
                                            <i className="ph ph-x-circle"></i> رد سفارش
                                        </button>
                                    </div>
                                    <button onClick={() => setSelectedOrderReceipt(null)} className="w-full mt-4 bg-transparent border border-slate-600 hover:bg-slate-700 py-2 rounded-lg text-sm transition">
                                        بستن
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            const MainRouter = () => {
                switch(view) {
                    case 'userPanel':
                        return (
                            <div className="flex flex-col items-center justify-center min-h-screen p-4 space-y-6 relative pt-20">
                                <button onClick={() => setView('home')} className="absolute top-6 right-6 bg-slate-800 p-3 rounded-full hover:bg-slate-700 transition">
                                    <i className="ph ph-arrow-right text-xl"></i>
                                </button>
                                <h2 className="text-3xl font-bold text-brand-400 mb-8">پنل کاربری</h2>
                                
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-2xl">
                                    <button onClick={() => setView('bot')} className="bg-slate-800 hover:bg-slate-700 border border-blue-500/30 p-8 rounded-3xl flex flex-col items-center justify-center gap-4 transition group">
                                        <div className="bg-blue-500/20 p-4 rounded-full group-hover:scale-110 transition">
                                            <i className="ph ph-robot text-5xl text-blue-400"></i>
                                        </div>
                                        <span className="text-xl font-bold">بخش بات</span>
                                    </button>
                                    
                                    <button onClick={() => setView('site')} className="bg-slate-800 hover:bg-slate-700 border border-emerald-500/30 p-8 rounded-3xl flex flex-col items-center justify-center gap-4 transition group">
                                        <div className="bg-emerald-500/20 p-4 rounded-full group-hover:scale-110 transition">
                                            <i className="ph ph-globe text-5xl text-emerald-400"></i>
                                        </div>
                                        <span className="text-xl font-bold">بخش سایت</span>
                                    </button>
                                </div>

                                <button onClick={() => setView('myOrders')} className="mt-8 text-gray-400 hover:text-white flex items-center gap-2 bg-slate-800 px-6 py-3 rounded-xl transition">
                                    <i className="ph ph-list-dashes"></i> پیگیری سفارشات من
                                </button>
                            </div>
                        );
                    case 'bot': return <BotFormView />;
                    case 'site': return <SiteFormView />;
                    case 'checkout': return <CheckoutView />;
                    case 'admin': return <AdminPanelView />;
                    case 'support': return <SupportView />;
                    case 'myOrders': return <MyOrdersView />;
                    case 'home':
                    default:
                        return (
                            <div className="flex flex-col items-center justify-center min-h-screen p-4 text-center">
                                <div className="mb-12">
                                    <h1 className="text-4xl md:text-6xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400 mb-4">
                                        پلتفرم خدمات ابری و بات
                                    </h1>
                                    <p className="text-gray-400 max-w-md mx-auto">ارائه دهنده راهکارهای هوشمند، بات‌های اختصاصی و سرورهای پرسرعت ابری و اختصاصی.</p>
                                </div>

                                <div className="flex flex-col w-full max-w-sm space-y-4">
                                    <button onClick={() => setView('userPanel')} className="bg-gradient-to-r from-brand-600 to-brand-500 hover:from-brand-500 hover:to-brand-400 text-white font-bold py-4 px-6 rounded-2xl shadow-lg flex items-center justify-center gap-3 transition transform hover:-translate-y-1">
                                        <i className="ph ph-user text-2xl"></i>
                                        پنل کاربر
                                    </button>
                                    
                                    <button onClick={() => setView('admin')} className="bg-slate-800 hover:bg-slate-700 text-white font-bold py-4 px-6 rounded-2xl shadow-lg flex items-center justify-center gap-3 transition">
                                        <i className="ph ph-shield-star text-2xl text-purple-400"></i>
                                        پنل مدیریت
                                    </button>
                                    
                                    <button onClick={() => setView('support')} className="bg-slate-800 hover:bg-slate-700 text-white font-bold py-4 px-6 rounded-2xl shadow-lg flex items-center justify-center gap-3 transition">
                                        <i className="ph ph-headset text-2xl text-green-400"></i>
                                        پشتیبانی
                                    </button>
                                </div>
                            </div>
                        );
                }
            };

            return (
                <div className="min-h-screen relative">
                    <ToastComponent />
                    <MainRouter />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
